<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto - Baterías Matute</title>
        <link rel="stylesheet" href="css/stylesOrlan.css">
    </head>

    <body>
        <header>
            <section class="brand-section">
                <img src="img/LogoBateriasMatute.jpeg" alt="Logo de la empresa" class="brand-logo">
                <h1>Catalogo de Baterías</h1>
            </section>
            <nav>
                <ul>
                    <li><a href="">Inicio</a></li>
                    <li><a href="">Productos</a></li>
                    <li><a href="">Nosotros</a></li>
                    <li><a href="">Contacto</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="contact-section">
                <h2 class="contact_title">Contáctanos</h2>
                <form class="contact_form" action="#" method="POST">
                    <div class="contact_field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="contact_field">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <div class="contact_field">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div class="contact_field">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="contact_submit">Enviar mensaje</button>
                </form>
            </section>
        </main>
        <footer>
            <p>© 2023 Baterías Matute. Todos los derechos reservados.</p>
        </footer>
    </body>

</html>
